name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Download MediaPipe models
        shell: bash
        run: |
          mkdir -p app/src/main/assets

          curl -L --fail \
            "https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task" \
            -o app/src/main/assets/face_landmarker.task

          curl -L --fail \
            "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task" \
            -o app/src/main/assets/hand_landmarker.task

          curl -L --fail \
            "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task" \
            -o app/src/main/assets/pose_landmarker_lite.task

          ls -lh app/src/main/assets

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Camera-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error